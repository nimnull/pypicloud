[tox]
envlist = py314, lint

[testenv]
deps = -rrequirements_test.txt
passenv =
    REDIS_HOST
    REDIS_CLUSTER_HOST
    REDIS_PORT
    POSTGRES_USER
    POSTGRES_PASSWORD
    POSTGRES_HOST
    POSTGRES_PORT
    POSTGRES_DB
    MYSQL_USER
    MYSQL_PASSWORD
    MYSQL_HOST
    MYSQL_PORT
    MYSQL_DB
    LDAP_HOST
    DYNAMO_HOST
    DYNAMO_PORT
    GCS_HOST
    GCS_PORT
    HOME
setenv =
  BOTO_CONFIG = /nowhere
extras = all_plugins
commands =
    coverage run --source=pypicloud --branch -m pytest {posargs}

[testenv:lint]
ignore_errors = true
commands =
    ruff check pypicloud tests setup.py scripts
    ruff format --check pypicloud tests setup.py scripts
    mypy pypicloud

[testenv:format]
commands =
    ruff check --fix pypicloud tests setup.py scripts
    ruff format pypicloud tests setup.py scripts

[testenv:coveralls]
deps =
    wheel
    coveralls
passenv =
    GITHUB_ACTIONS
    GITHUB_TOKEN
    GITHUB_REF
    GITHUB_HEAD_REF
commands =
    coveralls --service=github
