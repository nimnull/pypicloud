name: Python package

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [test, lint]

    steps:
    - uses: actions/checkout@v4
    - name: Build containers
      run: ./compose build
    - name: Run tests
      if: ${{ matrix.task == 'test' }}
      run: ./compose run uv run --frozen coverage run --source=pypicloud --branch -m pytest
    - name: Publish coverage
      if: ${{ matrix.task == 'test' }}
      run: ./compose run uv run --frozen coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Lint
      if: ${{ matrix.task == 'lint' }}
      run: |
        ./compose run uv run --frozen ruff check pypicloud tests scripts
        ./compose run uv run --frozen ruff format --check pypicloud tests scripts
        ./compose run uv run --frozen mypy pypicloud
