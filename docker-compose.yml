services:
  shell:
    build: ./docker
    volumes:
      - .:/pypicloud
    working_dir: /pypicloud
    init: true
    environment:
      HOME: /pypicloud
      REDIS_HOST: redis
      REDIS_CLUSTER_HOST: redis-cluster-node-2
      POSTGRES_HOST: postgres
      POSTGRES_DB: postgres
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: iamroot
      MYSQL_DB: test
      LDAP_HOST: ldap
      GITHUB_ACTIONS: $GITHUB_ACTIONS
      GITHUB_TOKEN: $GITHUB_TOKEN
      GITHUB_REF: $GITHUB_REF
      GITHUB_HEAD_REF: $GITHUB_HEAD_REF
      DYNAMO_HOST: dynamodb
      GCS_HOST: fake-gcs-server
    user: ${CURRENT_UID:?"Please run through the ./compose script, which sets CURRENT_UID"}
    stdin_open: true
    tty: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis-cluster-node-2:
        condition: service_healthy
      ldap:
        condition: service_started
      azurite:
        condition: service_started
      fake-gcs-server:
        condition: service_started
      dynamodb:
        condition: service_started
  redis:
    image: "redis"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
  redis-cluster-node-0:
    image: docker.io/bitnamilegacy/redis-cluster:8.2.1
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_NODES=redis-cluster-node-0 redis-cluster-node-1 redis-cluster-node-2'
  redis-cluster-node-1:
    image: docker.io/bitnamilegacy/redis-cluster:8.2.1
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_NODES=redis-cluster-node-0 redis-cluster-node-1 redis-cluster-node-2'
  redis-cluster-node-2:
    image: docker.io/bitnamilegacy/redis-cluster:8.2.1
    depends_on:
      - redis-cluster-node-0
      - redis-cluster-node-1
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_NODES=redis-cluster-node-0 redis-cluster-node-1 redis-cluster-node-2'
      - 'REDIS_CLUSTER_REPLICAS=0'
      - 'REDIS_CLUSTER_CREATOR=yes'
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli cluster info | grep -q cluster_state:ok
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  postgres:
    image: 'postgres'
    environment:
      POSTGRES_PASSWORD: ''
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 40s
  mysql:
    image: 'mysql'
    command: --character-set-server=utf8mb4
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: iamroot
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 40s
  ldap:
    image: 'osixia/openldap'
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: ['--loglevel', 'debug', '--copy-service']
  azurite:
    image: 'mcr.microsoft.com/azure-storage/azurite'
    hostname: "devstoreaccount1.azurite"
    ports:
      - "10000:10000"
    command: ["azurite-blob", "--blobHost=0.0.0.0", "--blobPort=10000"]
  fake-gcs-server:
    image: 'fsouza/fake-gcs-server'
    ports:
      - '4443:4443'
    command: [-scheme, http, -external-url, 'http://fake-gcs-server:4443', -public-host, 'fake-gcs-server:4443']
  dynamodb:
    image: amazon/dynamodb-local
